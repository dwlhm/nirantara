name: Production Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK & Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign and Package Release Artifacts
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          # Determine tag name
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "Target Release Tag: $TAG_NAME"

          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "$APK_PATH" ] || [ -z "$AAB_PATH" ]; then
            echo "Error: Build artifacts not found!"
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing with production keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$APK_PATH" "$KEY_ALIAS"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_PATH" "$KEY_ALIAS"
            rm -f release.keystore
          else
            echo "No production keystore secrets configured; signing with fallback debug key..."
            keytool -genkeypair -v -keystore fallback.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Nirantara,O=OpenSource,C=US"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore fallback.keystore -storepass android -keypass android "$APK_PATH" androiddebugkey
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore fallback.keystore -storepass android -keypass android "$AAB_PATH" androiddebugkey
            rm -f fallback.keystore
          fi

          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/Nirantara-${TAG_NAME}.apk"
          cp "$AAB_PATH" "release-artifacts/Nirantara-${TAG_NAME}.aab"
          echo "Generated release artifacts:"
          ls -la release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Release Artifacts (Workflow Dispatch / CI Archive)
        uses: actions/upload-artifact@v4
        with:
          name: nirantara-release-binaries
          path: release-artifacts/
          retention-days: 14
